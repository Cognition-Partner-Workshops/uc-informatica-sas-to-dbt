name: Warehouse fixture
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/informatica_baseline.py
      - run: git diff --exit-code -- baseline/informatica
      - run: pytest -q
      - run: ruff check tools tests
