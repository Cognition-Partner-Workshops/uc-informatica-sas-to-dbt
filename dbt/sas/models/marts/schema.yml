version: 2

models:
  - name: cust_accounts_daily
    description: Daily customer account snapshot (STG_BANK.CUST_ACCOUNTS_DAILY).
    columns:
      - name: account_id
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: snapshot_date
        tests: [not_null]
      - name: account_type
        tests:
          - accepted_values:
              values: ['CHK', 'SAV', 'MMA', 'CD', 'IRA', 'LOC', 'MTG', 'AUTO', 'PERS', 'CC', 'HELC']
      - name: dormancy_flag
        tests:
          - accepted_values:
              values: ['Y', 'N']
      - name: high_balance_flag
        tests:
          - accepted_values:
              values: ['Y', 'N']

  - name: acct_exceptions
    description: Data-quality exception rows (STG_BANK.ACCT_EXCEPTIONS).
    columns:
      - name: account_id
        tests: [not_null]

  - name: daily_transactions
    description: Curated transactions, history plus current feed (CURATED.DAILY_TRANSACTIONS).
    columns:
      - name: transaction_id
        tests: [not_null, unique]
      - name: account_id
        tests: [not_null]
      - name: transaction_type
        tests:
          - accepted_values:
              values: ['DEP', 'WDR', 'TRF', 'PMT', 'FEE', 'INT', 'ADJ', 'REV', 'CHG', 'REF']

  - name: txn_anomalies
    description: Anomalous transactions (CURATED.TXN_ANOMALIES).
    columns:
      - name: transaction_id
        tests: [not_null, unique]
      - name: anomaly_type
        tests:
          - not_null
          - accepted_values:
              values: ['HIGH_AMOUNT', 'OVERDRAFT', 'LARGE_WITHDRAWAL', 'ORPHAN_ACCOUNT']

  - name: running_balances
    description: Per-transaction running balances (CURATED.RUNNING_BALANCES).
    columns:
      - name: transaction_id
        tests: [not_null, unique]
      - name: account_id
        tests: [not_null]

  - name: risk_scores
    description: Scored portfolio (CURATED.RISK_SCORES).
    columns:
      - name: account_id
        tests: [not_null, unique]
      - name: pd
        tests: [not_null]
      - name: lgd
        tests: [not_null]
      - name: ead
        tests: [not_null]
      - name: new_risk_rating
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6, 7]
              quote: false

  - name: risk_migration
    description: Rating migrations (CURATED.RISK_MIGRATION).
    columns:
      - name: account_id
        tests: [not_null, unique]
      - name: migration_direction
        tests:
          - not_null
          - accepted_values:
              values: ['NEW', 'UPGRADE', 'DOWNGRADE', 'STABLE']

  - name: risk_summary
    description: Portfolio risk summary (REPORTS.RISK_SUMMARY).
    columns:
      - name: account_type
        tests: [not_null]
      - name: new_risk_rating
        tests: [not_null]

  - name: monthly_rwa
    description: Risk-weighted assets rollup (REPORTS.MONTHLY_RWA).
    columns:
      - name: report_month
        tests: [not_null]
      - name: risk_weight
        tests:
          - not_null
          - accepted_values:
              values: [0.00, 0.35, 0.50, 0.75, 1.00]
              quote: false

  - name: delinquency_aging
    description: Delinquency aging buckets (REPORTS.DELINQUENCY_AGING).
    columns:
      - name: delinq_bucket
        tests:
          - not_null
          - accepted_values:
              values: ['Current', '1-29', '30-59', '60-89', '90-119', '120-179', '180+', 'Unknown']

  - name: llp_coverage
    description: Loan loss provision coverage (REPORTS.LLP_COVERAGE).
    columns:
      - name: account_type
        tests: [not_null, unique]

  - name: capital_adequacy
    description: Capital adequacy summary (REPORTS.CAPITAL_ADEQUACY).
    columns:
      - name: cet1_status
        tests:
          - accepted_values:
              values: ['PASS', 'FAIL']
      - name: tier1_status
        tests:
          - accepted_values:
              values: ['PASS', 'FAIL']
      - name: total_capital_status
        tests:
          - accepted_values:
              values: ['PASS', 'FAIL']

  - name: claims_register
    description: Adjudicated claims register (STG_INS.CLAIMS_REGISTER).
    columns:
      - name: claim_id
        tests: [not_null, unique]
      - name: policy_id
        tests: [not_null]
      - name: claim_status
        tests:
          - not_null
          - accepted_values:
              values: ['APPR', 'DENY', 'PEND']
      - name: fraud_risk
        tests:
          - not_null
          - accepted_values:
              values: ['LOW', 'MEDIUM', 'HIGH']

  - name: claims_review_queue
    description: Manual review queue (STG_INS.CLAIMS_REVIEW_QUEUE).
    columns:
      - name: claim_id
        tests: [not_null, unique]
      - name: adjudication_result
        tests:
          - not_null
          - accepted_values:
              values: ['DENY', 'PEND']

  - name: fraud_alerts
    description: High fraud-risk SIU alerts (STG_INS.FRAUD_ALERTS).
    columns:
      - name: claim_id
        tests: [not_null, unique]
      - name: fraud_risk
        tests:
          - accepted_values:
              values: ['HIGH']
      - name: alert_reason
        tests: [not_null]

  - name: policy_valuation
    description: Monthly policy valuation (STG_INS.POLICY_VALUATION).
    columns:
      - name: policy_id
        tests: [not_null, unique]
      - name: premium_adequate
        tests:
          - not_null
          - accepted_values:
              values: ['Y', 'N']
      - name: renewal_due_flag
        tests:
          - not_null
          - accepted_values:
              values: ['Y', 'N']
      - name: policy_type
        tests:
          - accepted_values:
              values: ['WL', 'TL', 'UL', 'VL', 'AUTO', 'HOME', 'RENT', 'UMBR', 'HLTH', 'DNTL', 'VIS', 'DISAB', 'LTCI']

  - name: loss_ratio_summary
    description: Loss ratio summary by line of business (REPORTS.LOSS_RATIO_SUMMARY).
    columns:
      - name: policy_type
        tests: [not_null, unique]
      - name: n_policies
        tests: [not_null]
