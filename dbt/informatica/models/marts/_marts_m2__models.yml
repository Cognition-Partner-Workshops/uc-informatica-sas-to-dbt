        description: "RECOVERED: source description."
        tests: [not_null]
      - name: SHORT_NAME
        description: "RECOVERED: source short name."
        tests: [not_null]
      - name: CREATED_BY
        description: "RECOVERED: unconnected target port; typed NULL."
      - name: CREATED_TIME
        description: "RECOVERED: unconnected target port; typed NULL."
      - name: UPDATED_BY
