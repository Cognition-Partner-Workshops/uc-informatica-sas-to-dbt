version: 2

models:
  - name: demo_target1_ins
    description: "RECOVERED: m_demo_mapping2 Insert target instance, emitted as a dbt table. DECISION: demo_target1 is one target definition with two instances writing one physical table; dbt has no two-writers-to-one-table concept, so this instance is a separate model. Rejected alternative: a unioned model with an invented row-operation column, which would break per-instance parity against the two baseline CSVs."
    columns:
      - name: Key
        description: "RECOVERED: SEQTRANS-generated insert key."
        tests: [not_null]
      - name: LEAD_CO_MNE
        description: "RECOVERED: source lead company mnemonic."
        tests: [not_null]
      - name: BRANCH_CO_MNE
        description: "RECOVERED: source branch company mnemonic."
        tests: [not_null]
      - name: MIS_DATE
        description: "RECOVERED: source MIS date VARCHAR."
        tests: [not_null]
      - name: ID
        description: "RECOVERED: source target business key."
        tests: [not_null, unique]
      - name: DESCRIPTION
        description: "RECOVERED: source description."
        tests: [not_null]
      - name: SHORT_NAME
        description: "RECOVERED: source short name."
        tests: [not_null]
      - name: CREATED_BY
        description: "RECOVERED: literal IDWUSER."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['IDWUSER']
      - name: CREATED_TIME
        description: "RECOVERED: SYSDATE pinned to the business timestamp."
        tests: [not_null]
      - name: UPDATED_BY
        description: "RECOVERED: unconnected target port; typed NULL."
      - name: UPDATED_TIME
        description: "RECOVERED: unconnected target port; typed NULL."
      - name: ACTIVE_FLAG
        description: "RECOVERED: unconnected target port; typed NULL."
      - name: START_DATE
        description: "RECOVERED: unconnected target port; typed NULL."
      - name: END_DATE
        description: "RECOVERED: unconnected target port; typed NULL."
