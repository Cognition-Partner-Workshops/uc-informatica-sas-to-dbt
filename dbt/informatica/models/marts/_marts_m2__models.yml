    description: "RECOVERED: m_demo_mapping2 Update target instance, emitted as a dbt table. DECISION: demo_target1 is one target definition with two instances writing one physical table; dbt has no two-writers-to-one-table concept, so this instance is a separate model. Rejected alternative: a unioned model with an invented row-operation column, which would break per-instance parity against the two baseline CSVs."
    columns:
      - name: Key
        description: "RECOVERED: LKPTRANS target-state key."
        tests: [not_null]
      - name: LEAD_CO_MNE
        description: "RECOVERED: source lead company mnemonic."
        tests: [not_null]
      - name: BRANCH_CO_MNE
        description: "RECOVERED: source branch company mnemonic."
        tests: [not_null]
      - name: MIS_DATE
        description: "RECOVERED: source MIS date VARCHAR."
        tests: [not_null]
      - name: ID
        description: "RECOVERED: source target business key."
        tests: [not_null, unique]
