version: 2

models:
  - name: demo_target2
    columns:
      - name: Title
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['MR', 'MS']
      - name: Gender
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['F', 'M']
      - name: First_Name
        tests: [not_null]
      - name: Middle_Name
        tests: [not_null]
      - name: Last_Name
        tests: [not_null]
      - name: Member_Identifier
        tests: [not_null, unique]
      - name: Date_of_Birth
        tests: [not_null]
      - name: Member_Number
        tests: [not_null]
      - name: Type_Code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1.0, 2.0]
      - name: Relationship_to_Subscriber_Code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1.0, 2.0, 18.0, 19.0]
      - name: Relationship_to_Subscriber_Code_Label
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CHILD', 'OTHER', 'SELF', 'SPOUSE']
      - name: Effective_Date
        tests: [not_null]
