        - {ACCT_ID: 1002, ACCT_TYP: 'SB', ACCT_DESC: 'Account', CRDT_LN: '48000', CR8_DT: '2024-01-31 00:00:00', CLSR_DT: null, ACCT_STAT_CD: 'D', TX_ID: 5003, LAST_NM: 'SILVA', TX_DTTM: '2024-01-14 05:49:00', TX_AMT: -1238.81, BAL_AMT: 91291.88, CUST_ID: 70032, o_acc_trim: 'SB', o_crdt_trim: '48000', o_ACCT_DESC: 'Account', o_ACCT_ID: 'DR', FIRST_NM: 'OMAR', CRDT_SCORE: 677}

