version: 2

unit_tests:
  - name: m1_last_value_lkp_demo_source3
    model: int_m1_lkp_demo_source3
    given:
      - input: ref('stg_m1_lkp_demo_source3')
        rows:
          - {ACCT_ID: 1002, TX_TYPE_CD: 'TR', TX_TYPE_DESC: 'first', __seed_row: 2}
          - {ACCT_ID: 1002, TX_TYPE_CD: 'DR', TX_TYPE_DESC: 'last', __seed_row: 3}
          - {ACCT_ID: 1003, TX_TYPE_CD: 'DR', TX_TYPE_DESC: 'other', __seed_row: 4}
    expect:
      rows:
        - {ACCT_ID: 1002, TX_TYPE_CD: 'DR', TX_TYPE_DESC: 'last'}
        - {ACCT_ID: 1003, TX_TYPE_CD: 'DR', TX_TYPE_DESC: 'other'}

  - name: m1_sql_override_pinned_cr8_dt
    model: int_m1_sq_demo_source4
    given:
      - input: ref('stg_m1_demo_source3')
        rows:
          - {TX_ID: 5002, ACCT_ID: 1001, FIRST_NM: 'MAX', LAST_NM: 'SINGH', TX_DTTM: '2024-01-15 11:00:00', TX_AMT: -100.0, TX_TYPE_CD: 'CR', BAL_AMT: 42229.05, TX_DESC: 'FEE', CRDT_SCORE: 420, CUST_ID: 70031}
      - input: ref('stg_m1_demo_source4')
        rows:
          - {ACCT_ID: 1001, ACCT_TYP: 'SB', ACCT_DESC: 'Account', CRDT_LN: '  8000', CR8_DT: '2023-08-18', CLSR_DT: '2025-06-30', ACCT_STAT_CD: 'A'}
    expect:
      rows:
        - {ACCT_ID: 1001, ACCT_TYP: 'SB', ACCT_DESC: 'Account', CRDT_LN: '  8000', CR8_DT: '2024-01-31 00:00:00', CLSR_DT: '2025-06-30', ACCT_STAT_CD: 'A', TX_ID: 5002, LAST_NM: 'SINGH', TX_DTTM: '2024-01-15 11:00:00', TX_AMT: -100.0, BAL_AMT: 42229.05, CUST_ID: 70031}

  - name: m1_exp_lookup_return_ports
    model: int_m1_exp_trans
    given:
      - input: ref('int_m1_sq_demo_source4')
        rows:
          - {ACCT_ID: 1002, ACCT_TYP: 'SB', ACCT_DESC: 'Account', CRDT_LN: '48000', CR8_DT: '2024-01-31 00:00:00', CLSR_DT: null, ACCT_STAT_CD: 'D', TX_ID: 5003, LAST_NM: 'SILVA', TX_DTTM: '2024-01-14 05:49:00', TX_AMT: -1238.81, BAL_AMT: 91291.88, CUST_ID: 70032}
      - input: ref('int_m1_lkp_demo_source3')
        rows:
          - {ACCT_ID: 1002, TX_TYPE_CD: 'DR', TX_TYPE_DESC: 'last'}
      - input: ref('int_m1_lkp_demo_source1')
        rows:
          - {ACCT_ID: 1002, CUST_ID: 70032, FIRST_NM: 'OMAR', LAST_NM: 'SILVA', CUST_ADDR: null, CUST_PHN: null, CUST_EML_ADDR: null, AGE: null, DOB: null, CUST_TYP: null}
